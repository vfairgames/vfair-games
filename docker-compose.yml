services:
  postgres:
    image: postgres:18-alpine
    pull_policy: missing
    environment:
      POSTGRES_DB: vfairgames
      POSTGRES_USER: vfair
      POSTGRES_PASSWORD: vfair
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vfair -d vfairgames']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    pull_policy: missing
    stop_grace_period: 5s
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.3-management-alpine
    pull_policy: missing
    environment:
      RABBITMQ_DEFAULT_USER: vfair
      RABBITMQ_DEFAULT_PASS: vfair
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    pull_policy: missing
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vfair.com
      PGADMIN_DEFAULT_PASSWORD: vfair
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '127.0.0.1:5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  pgadmin-data:
